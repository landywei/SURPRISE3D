# Finetune Reason3D with chain v3 CoT (multi-step reasoning + W1-pure mass-pool
# feedback + CriterionV3 loss). The architecture is `Reason3DT5ChainV3CoT`,
# which adds a single linear `mask_pool_proj` (d_sp -> d_t5) on top of
# `Reason3DT5ChainV3`; everything else is inherited.
#
# Two-pass training: pass 1 over (Q-Former + text), pass 2 over
# (Q-Former + text + mass-pool token). Pass-1 LM loss is masked out for
# CoT samples (they get pass-2 LM loss); non-CoT samples (cs / hi /
# camera_view, or relational queries where regex misses a landmark)
# follow the chain-v3 single-pass behavior.
#
# From Models/reason3d:
#   REASON3D_INIT_CKPT=/path/to/reason3d.pth bash scripts/run_surprise_finetune_chainv3_cot.sh
#
# Overrides use the `datasets.3d_refer_chainv3_cot` prefix:
#   REASON3D_TRAIN_OPTIONS="datasets.3d_refer_chainv3_cot.dataset_init.cot_template_prob=0.5"
#   REASON3D_TRAIN_OPTIONS="model.seg_criterion_cfg.enable_boundary=true"
#
# Companion design doc: Models/reason3d/docs/chainv3_cot_design_space.md

model:
  arch: reason3d_t5_chainv3_cot
  model_type: pretrain_flant5xl
  reason3d_checkpoint: null
  use_grad_checkpoint: False
  mask_embedding: False
  point_encoder_cfg:
    input_channel: 6
    media: 32
    normalize_before: True
    return_blocks: True
    fix_module: ["input_conv", "unet", "output_layer"]
    pretrained: "/nfs-stor/lan.wei/data/checkpoints/spf_scannet_512.pth"
  mask_decoder_cfg:
    media: 32
    num_layer: 6
    d_model: 256
    d_text: 512
    nhead: 8
    hidden_dim: 1024
    dropout: 0.0
    activation_fn: "gelu"
    attn_mask: True
  seg_criterion_cfg:
    # Legacy weights (matches chain v2 / chain v3 loss-only): [bce, dice, score, sample]
    loss_weight: [1.0, 1.0, 0.5, 5.0]
    loss_fun: "focal"
    # CriterionV3 default: best-of-set + scale-aware on; boundary / point-aux off.
    enable_best_of_set: true
    enable_scale_aware: true
    enable_boundary: false
    enable_point_aux: false
    lambda_boundary: 0.5
    lambda_point_aux: 0.5
    lambda_cov: 0.1
    small_size_threshold: 50
    boundary_loss_type: "lovasz"
  pred_confidence: 0.5

datasets:
  3d_refer_chainv3_cot:
    dataset_init:
      pth_rel_subdir: "processed_surprise_full_pth"
      filter_missing_gt_in_pth: true
      instance_id_cache_file: "/nfs-stor/lan.wei/data/scannetpp/processed_surprise_full_pth/.reason3d_instance_ids.json"
      instance_id_cache_write: false
      object_name_keys: ["object_name"]
      max_object_name_chars: 96
      chain_answer_fallback_plain: true
      # CoT-only knobs:
      cot_template_prob: 1.0
      cot_question_types: ["relative_position", "abs", "first_view"]
      cot_target_phrase_template: "the {name}"
    text_processor:
      train:
        name: "blip_question"
        prompt: ""
      eval:
        name: "blip_question"
    build_info:
      annotations:
        train:
          storage: /nfs-stor/lan.wei/data/annotations/surprise_train.json
        val:
          storage: /nfs-stor/lan.wei/data/annotations/surprise_val.json
        test:
          storage: /nfs-stor/lan.wei/data/annotations/surprise_val.json
      points:
        storage: /nfs-stor/lan.wei/data/scannetpp

run:
  task: 3d_refer_seg_v3
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-8
  warmup_steps: 1000
  weight_decay: 0.05
  max_epoch: 20
  batch_size_train: 2
  batch_size_eval: 1
  num_workers: 4
  accum_grad_iters: 1
  max_len: 96
  min_len: 1
  num_beams: 5
  inference_method: "generate"
  seed: 42
  output_dir: "output/reason3d_surprise_finetune_chainv3_cot"
  amp: True
  evaluate: False
  save_before_eval: True
  save_every_n_steps: 0
  train_splits: ["train"]
  valid_splits: []
  test_splits: []
  device: "cuda"
  gpu: 0
  world_size: 1
  distributed: false
  dist_url: "env://"

# Full Surprise val split, chain v3 dataset+task: union mIoU/Acc as in chain v2,
# **plus** per-instance hit@0.25 / hit@0.50 / max-per-instance IoU printed by
# `ThreeDReferSegTaskV3.after_evaluation`.
#
# Use this YAML to evaluate any chain checkpoint with the new metrics:
#   CFG=lavis/projects/reason3d/val/reason3d_surprise_zeroshot_chainv3.yaml \
#     REASON3D_CKPT=/path/to/checkpoint.pth bash scripts/run_surprise_zeroshot_eval.sh
#
# Companion design doc: Models/reason3d/docs/chainv3_design_proposal.md

model:
  arch: reason3d_t5_chainv3
  model_type: pretrain_flant5xl
  reason3d_checkpoint: null
  use_grad_checkpoint: False
  mask_embedding: False
  point_encoder_cfg:
    input_channel: 6
    media: 32
    normalize_before: True
    return_blocks: True
    fix_module: ["input_conv", "unet", "output_layer"]
    pretrained: "/nfs-stor/lan.wei/data/checkpoints/spf_scannet_512.pth"
  mask_decoder_cfg:
    media: 32
    num_layer: 6
    d_model: 256
    d_text: 512
    nhead: 8
    hidden_dim: 1024
    dropout: 0.0
    activation_fn: "gelu"
    attn_mask: True
  seg_criterion_cfg:
    loss_weight: [1.0, 1.0, 0.5, 5.0]
    loss_fun: "focal"
    enable_best_of_set: true
    enable_scale_aware: true
    enable_boundary: false
    enable_point_aux: false
    lambda_boundary: 0.5
    lambda_point_aux: 0.5
    lambda_cov: 0.1
    small_size_threshold: 50
    boundary_loss_type: "lovasz"
  pred_confidence: 0.5

datasets:
  3d_refer_chainv3:
    dataset_init:
      # Pre-filtered annotations; runtime filter off. See
      # scripts/build_filtered_surprise_val.py.
      filter_missing_gt_in_pth: false
      pth_rel_subdir: "processed_surprise_full_pth"
      object_name_keys: ["object_name"]
      max_object_name_chars: 96
      chain_answer_fallback_plain: true
    text_processor:
      train:
        name: "blip_question"
        prompt: ""
      eval:
        name: "blip_question"
    build_info:
      annotations:
        test:
          storage: /nfs-stor/lan.wei/data/annotations/surprise_val_filtered_v1.json
      points:
        storage: /nfs-stor/lan.wei/data/scannetpp

run:
  task: 3d_refer_seg_v3
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-8
  warmup_steps: 1000
  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 1
  batch_size_eval: 1
  num_workers: 2
  accum_grad_iters: 1
  max_len: 60
  decode_repetition_penalty: 1.2
  decode_no_repeat_ngram_size: 3
  min_len: 1
  num_beams: 5
  inference_method: "generate"
  seed: 42
  output_dir: "output/reason3d_surprise_zeroshot_chainv3"
  save_eval_predictions: false
  save_eval_prediction_masks: false
  amp: True
  evaluate: True
  train_splits: []
  valid_splits: []
  test_splits: ["test"]
  use_dist_eval_sampler: false
  device: "cuda"
  gpu: 0
  world_size: 1
  distributed: false
  dist_url: "env://"
